name: Docker Push

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retain the 10 newest commit tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          token="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
              https://hub.docker.com/v2/users/login/ |
              jq -r ".token"
          )"
          test -n "$token" && test "$token" != "null"

          namespace="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            "https://hub.docker.com/v2/namespaces/$namespace/repositories/$repo/tags?page_size=100&ordering=last_updated" |
            jq -r ".results[].name | select(startswith(\"sha-\"))" |
            tail -n +11 |
            while read -r tag; do
              echo "Deleting Docker Hub tag: $tag"
              curl --fail --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer $token" \
                "https://hub.docker.com/v2/namespaces/$namespace/repositories/$repo/tags/$tag"
            done
